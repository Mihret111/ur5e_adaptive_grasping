# =============================
# environment.yaml
# =============================

num_trials: 1

# ───────────── ROOM ─────────────
build_room: true
room_size: [5.0, 5.0, 3.0]
room_wall_thickness: 0.05
floor_color: [0.6, 0.6, 0.6]
room_color: [0.8, 0.8, 0.8]

# ───────────── TABLE ─────────────
build_table: true
table_size: [1.0, 0.6, 0.75]
table_leg_radius: 0.02

# ───────────── DEBUG TABLE POSITION ─────────────

# fixed for now, not using table randomization
debug_fixed_table: true
debug_fixed_table_center: [1.10, 0.00, 0.0]
debug_fixed_table_size: [1.00, 0.60, 0.75]
debug_fixed_table_approach_deg: 0.0
debug_fixed_table_facing: "long"
table_size_range: null
# ───────────── TABLE PLACEMENT ─────────────

near_edge_padding: 0.03

# ───────────── REACH ─────────────
arm_min_reach: 0.30
arm_max_reach: 0.85
reach_safety_margin: 0.05

# ───────────── GRASP HEIGHTS ─────────────

# height of approach above the object
pregrasp_height: 0.08 

# height used by the generic safe_above waypoint
safe_approach_height: 0.15

# ───────────── PICK-LIFT-PLACE SETTINGS ─────────────

move_home_before_pick: true
enable_pre_grasp_test: true
enable_grasp_pose_test: true
enable_gripper_close_test: true

# ───────────── GRASP VALIDATION ─────────────
max_object_shift_during_close_m: 0.03
# The ff may be too strict or too loose depending on where flange
# is relative to the real gripper center.
max_object_flange_distance_after_close_m: 0.25  

min_success_lift_delta_m: 0.04
min_object_above_table_m: 0.03
max_object_flange_distance_after_lift_m: 0.25

post_failed_close_pause_seconds: 0.5
post_open_settle_seconds: 0.8
retry_to_pregrasp_duration: 3.0
retry_to_pregrasp_steps: 180
retry_mid_settle_seconds: 0.3
retry_to_safe_duration: 4.0
retry_to_safe_steps: 240

# ───────────── LIFT-OFF SETTINGS ─────────────
lift_duration: 5.0
lift_steps: 300
post_close_hold_seconds: 1.0
# ───────────── INSPECTION ─────────────

debug_hold_after_stage: false
inspection_hold_seconds: 2.0 # how many seconds to hold before opening in inspection
leave_sim_running_after_trial: false

post_home_settle_seconds: 0.8

reset_robot_before_trial: true
park_robot_after_trial: true

startup_home_duration: 4.0
startup_home_steps: 240
post_home_settle_seconds: 0.8

park_gripper_open_seconds: 0.8
park_home_duration: 3.0
park_home_steps: 180
park_settle_seconds: 0.5

# seconds to keep scene visible after trial ends (before next reset)
# useful for recording videos
post_spawn_settle_seconds: 0.5
post_run_hold_seconds: 0.0



# ───────────── Cascaded IK planner: fast nominal → 2 whole-chain retries → beam fallback

# Keep grasp contact intent in control. Alternate gripper yaws are NOT tried
# unless explicitly enabled later by the grasp-strategy layer.
grasp_try_alternate_orientations: true

# Tier 1: only after the intuitive nominal chain fails, retry the COMPLETE
# chain from at most two deterministic elbow-up warm-start hypotheses.
ik_enable_chain_fallbacks: true
ik_max_chain_fallbacks: 2

# Tier 2: only after nominal + both lightweight retries fail, activate a small
# downstream-aware beam search. These values are deliberately modest.
ik_enable_beam_fallback: true
ik_beam_width: 4
ik_beam_max_children_per_state: 3
ik_beam_max_seed_hypotheses: 6
ik_solution_dedup_deg: 4.0

# Candidate ranking used only inside the last-resort beam fallback.
ik_motion_score_weight: 1.0
ik_clearance_score_weight: 0.05

# Lean FK safety resolution. These remain small because the runtime collision
# guard still checks the actual simulated arm continuously during execution.
planner_path_sample_count: 6
planner_link_sample_count: 5
planner_fail_closed_on_missing_fk_frame: true

# Runtime emergency guard remains active.
collision_fail_closed_on_missing_link: true
collision_debug: false
collision_trace_all_links: false
forearm_sample_count: 7
collision_check_margin: 0.04
arm_body_clearance: 0.08

# Do not silently fall back to an unverified calibration motion.
allow_calibration_fallback_for_pick: false

# Current experiment: plan and execute only through grasp.
enable_lift_test: true
plan_retreat_during_pick: true

# ───────────── CALIBRATED PRE-CLOSE GEOMETRY GATE ─────────────
# Two diagnostic trials with different objects and table locations identified
# flange-local +X as the direction from flange toward the active finger region.
finger_capture_axis_local: "+X"
enable_preclose_geometry_gate: true

# Initial conservative thresholds.  Tune empirically after collecting a batch.
max_preclose_grasp_centre_xy_error_m: 0.015
min_preclose_vertical_overlap_m: 0.010
min_preclose_overlap_fraction: 0.70
max_preclose_flange_tracking_error_m: 0.010
robust_grip_margin_m: 0.003  #TODO justify this value based on gripper spec

# Keep as a diagnostic warning initially; do not reject solely on axis mismatch.
require_preclose_closest_axis_match: false

# The axis has been calibrated, so keep the concise output by default.
preclose_diagnostics_print_all_axes: false

# ───────────── CURRENT MICRO-LIFT VALIDATION EXPERIMENT ─────────────
# The pre-close gate remains active. After a successful close, lift only
# 25 mm and verify that the object genuinely follows the gripper.
enable_micro_lift_test: true
enable_lift_test: false
plan_retreat_during_pick: false
max_grasp_attempts: 2

micro_lift_height_m: 0.025
micro_lift_duration: 2.0
micro_lift_steps: 120
post_micro_lift_settle_seconds: 0.4

# Initial conservative acceptance thresholds for a commanded 25 mm lift.
min_success_micro_lift_delta_m: 0.015
min_commanded_micro_lift_delta_m: 0.015
min_micro_lift_following_ratio: 0.60
max_micro_lift_relative_drift_m: 0.015

# ───────────── FAILURE-AWARE RETRY POLICY ─────────────
# One additional attempt is allowed. RetryPolicy decides whether to use it
# and how to modify the next attempt from the observed failure class.
retry_close_fail_grasp_z_delta_m: -0.003

retry_no_follow_grasp_z_delta_m: -0.004
retry_no_follow_force_scale: 1.10
retry_no_follow_hold_extra_s: 0.4
retry_no_follow_micro_lift_speed_scale: 0.80

retry_partial_slip_grasp_z_delta_m: -0.002
retry_partial_slip_force_scale: 1.15
retry_partial_slip_hold_extra_s: 0.5
retry_partial_slip_micro_lift_speed_scale: 0.70

retry_thin_object_height_threshold_m: 0.015
min_fingertip_table_clearance_m: 0.0015


## Gripper contact plausibility
gripper_contact_position_tolerance_m: 0.004
gripper_min_unexpected_contact_joint_pos: 0.0015

#TODO according to dataset gripper_contact_position_upper_tolerance_m:± 0.1 mm , so tighten it later
gripper_contact_position_upper_tolerance_m: 0.004 #the gripper accepts contact within: expected ± 4 mm 

gripper_max_closing_ticks: 180
# gripper_min_closing_ticks: 15
# gripper_stall_ticks: 8

# Gripper close resolution guard
gripper_close_wait_timeout_s: 6.0
gripper_close_wait_updates_per_second: 60.0

# Gripper close asymmetry guard
gripper_max_clean_contact_asymmetry_m:   0.006
gripper_max_allowed_contact_asymmetry_m: 0.012


# Contact-aware retry policy additions
retry_near_table_extra_clearance_threshold_m: 0.003
retry_early_stall_raise_z_delta_m: 0.002
retry_close_fail_force_scale: 1.05
retry_close_fail_hold_extra_s: 0.3
retry_plausible_no_follow_grasp_z_delta_m: -0.001
retry_plausible_partial_slip_grasp_z_delta_m: 0.0
gripper_joint_open_pos_m: 0.0
gripper_joint_closed_pos_m: 0.019

# If the object moved this much during a failed attempt, retry is treated as
# fresh re-perception instead of a tiny correction to the previous grasp.
retry_object_displacement_fresh_pose_threshold_m: 0.015
retry_object_horizontal_displacement_fresh_pose_threshold_m: 0.015

# Thin-disc low-edge contact rule:
# when a thin object/disc contacts at the low/open edge and fails micro-lift,
# raise the next grasp slightly to avoid table-edge/tangential contact artifacts.
retry_low_edge_thin_raise_z_delta_m: 0.002
retry_low_edge_contact_alpha: 0.25

# Borderline micro-lift rule:
# if the object almost passes micro-lift, do not lower the next grasp.
retry_borderline_lift_delta_margin_m: 0.002
retry_borderline_following_ratio_margin: 0.08
retry_borderline_drift_margin_m: 0.004
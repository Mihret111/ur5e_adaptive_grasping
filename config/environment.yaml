# =============================
# environment.yaml
# =============================

num_trials: 1

# ───────────── ROOM ─────────────
build_room: true
room_size: [5.0, 5.0, 3.0]
room_wall_thickness: 0.05
floor_color: [0.6, 0.6, 0.6]
room_color: [0.8, 0.8, 0.8]

# ───────────── TABLE ─────────────
build_table: true
table_size: [1.0, 0.6, 0.75]
table_leg_radius: 0.02

# ───────────── DEBUG TABLE POSITION ─────────────

# fixed for now, not using table randomization
debug_fixed_table: true
debug_fixed_table_center: [1.10, 0.00, 0.0]
debug_fixed_table_size: [1.00, 0.60, 0.75]
debug_fixed_table_approach_deg: 0.0
debug_fixed_table_facing: "long"
table_size_range: null
# ───────────── TABLE PLACEMENT ─────────────

near_edge_padding: 0.03

# ───────────── REACH ─────────────
arm_min_reach: 0.30
arm_max_reach: 0.85
reach_safety_margin: 0.05

# ───────────── GRASP HEIGHTS ─────────────

# height of approach above the object
pregrasp_height: 0.08 

# height used by the generic safe_above waypoint
safe_approach_height: 0.15

# ───────────── PICK-LIFT-PLACE SETTINGS ─────────────

move_home_before_pick: true
enable_pre_grasp_test: true
enable_grasp_pose_test: true
enable_gripper_close_test: true

# ───────────── GRASP VALIDATION ─────────────
max_object_shift_during_close_m: 0.03
# The ff may be too strict or too loose depending on where flange
# is relative to the real gripper center.
max_object_flange_distance_after_close_m: 0.25  

min_success_lift_delta_m: 0.04
min_object_above_table_m: 0.03
max_object_flange_distance_after_lift_m: 0.25

post_failed_close_pause_seconds: 0.5
post_open_settle_seconds: 0.8
retry_to_pregrasp_duration: 3.0
retry_to_pregrasp_steps: 180
retry_mid_settle_seconds: 0.3
retry_to_safe_duration: 4.0
retry_to_safe_steps: 240

# ───────────── LIFT-OFF SETTINGS ─────────────
lift_duration: 5.0
lift_steps: 300
post_close_hold_seconds: 1.0
# ───────────── INSPECTION ─────────────

debug_hold_after_stage: false
inspection_hold_seconds: 2.0 # how many seconds to hold before opening in inspection
leave_sim_running_after_trial: false

post_home_settle_seconds: 0.8

reset_robot_before_trial: true
park_robot_after_trial: true

startup_home_duration: 4.0
startup_home_steps: 240

park_gripper_open_seconds: 0.8
park_home_duration: 3.0
park_home_steps: 180
park_settle_seconds: 0.5

# seconds to keep scene visible after trial ends (before next reset)
# useful for recording videos
post_spawn_settle_seconds: 0.5
post_run_hold_seconds: 0.0



# ───────────── Cascaded IK planner: fast nominal → 2 whole-chain retries → beam fallback

# Keep grasp contact intent in control. Alternate gripper yaws are NOT tried
# unless explicitly enabled later by the grasp-strategy layer.
grasp_try_alternate_orientations: true

# Tier 1: only after the intuitive nominal chain fails, retry the COMPLETE
# chain from at most two deterministic elbow-up warm-start hypotheses.
ik_enable_chain_fallbacks: true
ik_max_chain_fallbacks: 2

# Tier 2: only after nominal + both lightweight retries fail, activate a small
# downstream-aware beam search. These values are deliberately modest.
ik_enable_beam_fallback: true
ik_beam_width: 4
ik_beam_max_children_per_state: 3
ik_beam_max_seed_hypotheses: 6
ik_solution_dedup_deg: 4.0

# Candidate ranking used only inside the last-resort beam fallback.
ik_motion_score_weight: 1.0
ik_clearance_score_weight: 0.05

# Lean FK safety resolution. These remain small because the runtime collision
# guard still checks the actual simulated arm continuously during execution.
planner_path_sample_count: 6
planner_link_sample_count: 5
planner_fail_closed_on_missing_fk_frame: true

# Runtime emergency guard remains active.
collision_fail_closed_on_missing_link: true
collision_debug: false
collision_trace_all_links: false
forearm_sample_count: 7
collision_check_margin: 0.04
arm_body_clearance: 0.08

# Do not silently fall back to an unverified calibration motion.
allow_calibration_fallback_for_pick: false

# Current soft-object commissioning phase:
# validate real capture by micro-lift first; enable full lift only after
# the foam USD passes several stable micro-lift trials.

# ───────────── CALIBRATED PRE-CLOSE GEOMETRY GATE ─────────────
# Two diagnostic trials with different objects and table locations identified
# flange-local +X as the direction from flange toward the active finger region.
finger_capture_axis_local: "+X"
enable_preclose_geometry_gate: true

# Initial conservative thresholds.  Tune empirically after collecting a batch.
max_preclose_grasp_centre_xy_error_m: 0.015
min_preclose_vertical_overlap_m: 0.010
min_preclose_overlap_fraction: 0.70
max_preclose_flange_tracking_error_m: 0.010
robust_grip_margin_m: 0.003  #TODO justify this value based on gripper spec

# Keep as a diagnostic warning initially; do not reject solely on axis mismatch.
require_preclose_closest_axis_match: false

# The axis has been calibrated, so keep the concise output by default.
preclose_diagnostics_print_all_axes: false

# ───────────── CURRENT MICRO-LIFT VALIDATION EXPERIMENT ─────────────
# The pre-close gate remains active. After a successful close, lift only
# 25 mm and verify that the object genuinely follows the gripper.
enable_micro_lift_test: true
enable_lift_test: true
plan_retreat_during_pick: false
max_grasp_attempts: 2

micro_lift_height_m: 0.025
micro_lift_duration: 2.0
micro_lift_steps: 120
post_micro_lift_settle_seconds: 0.4

# Initial conservative acceptance thresholds for a commanded 25 mm lift.
min_success_micro_lift_delta_m: 0.015
min_commanded_micro_lift_delta_m: 0.015
min_micro_lift_following_ratio: 0.60
max_micro_lift_relative_drift_m: 0.015

# ───────────── FAILURE-AWARE RETRY POLICY ─────────────
# One additional attempt is allowed. RetryPolicy decides whether to use it
# and how to modify the next attempt from the observed failure class.
retry_close_fail_grasp_z_delta_m: -0.003

retry_no_follow_grasp_z_delta_m: -0.004
retry_no_follow_force_scale: 1.10
retry_no_follow_hold_extra_s: 0.4
retry_no_follow_micro_lift_speed_scale: 0.80

retry_partial_slip_grasp_z_delta_m: -0.002
retry_partial_slip_force_scale: 1.15
retry_partial_slip_hold_extra_s: 0.5
retry_partial_slip_micro_lift_speed_scale: 0.70

retry_thin_object_height_threshold_m: 0.015
min_fingertip_table_clearance_m: 0.0015


## Gripper contact plausibility
gripper_contact_position_tolerance_m: 0.004
gripper_min_unexpected_contact_joint_pos: 0.0015

# Pair-aware retry + compressed-contact grace additions
# Allow tiny overshoot beyond the nominal expected contact window.
# Useful for spheres/cylinders and small object-size/PhysX uncertainty.
gripper_compressed_contact_grace_m: 0.0015

# Pair limits are defined below with the close asymmetry guard.

#TODO according to dataset gripper_contact_position_upper_tolerance_m:± 0.1 mm , so tighten it later
gripper_contact_position_upper_tolerance_m: 0.004 #the gripper accepts contact within: expected ± 4 mm 

gripper_max_closing_ticks: 180
# gripper_min_closing_ticks: 15
# gripper_stall_ticks: 8

# Gripper close resolution guard
gripper_close_wait_timeout_s: 6.0
gripper_close_wait_updates_per_second: 60.0

# Gripper close asymmetry guard
gripper_max_clean_contact_asymmetry_m:   0.006
gripper_max_allowed_contact_asymmetry_m: 0.012


## Contact-aware retry policy additions
retry_near_table_extra_clearance_threshold_m: 0.003
retry_early_stall_raise_z_delta_m: 0.002
retry_close_fail_force_scale: 1.05
retry_close_fail_hold_extra_s: 0.3
retry_plausible_no_follow_grasp_z_delta_m: -0.001
retry_plausible_partial_slip_grasp_z_delta_m: 0.0
gripper_joint_open_pos_m: 0.0
gripper_joint_closed_pos_m: 0.019

## If the object moved this much during a failed attempt, retry is treated as
# fresh re-perception instead of a tiny correction to the previous grasp.
retry_object_displacement_fresh_pose_threshold_m: 0.015
retry_object_horizontal_displacement_fresh_pose_threshold_m: 0.015

## Thin-disc low-edge contact rule:
# when a thin object/disc contacts at the low/open edge and fails micro-lift,
# raise the next grasp slightly to avoid table-edge/tangential contact artifacts.
retry_low_edge_thin_raise_z_delta_m: 0.002
retry_low_edge_contact_alpha: 0.25

## Borderline micro-lift rule:
# if the object almost passes micro-lift, do not lower the next grasp.
retry_borderline_lift_delta_margin_m: 0.002
retry_borderline_following_ratio_margin: 0.08
retry_borderline_drift_margin_m: 0.004
# ───────────── FORCE OBSERVER / ADAPTIVE GRASPING PHASE 1 ─────────────
# Scientifically honest status:
#   Isaac ContactSensor.force was validated for rigid-rigid contact, but for
#   finger ↔ deformable foam it returned contact geometry with zero force.
#   The usable sim-side signal found by V10 is measured articulation effort
#   on the 2FG7 prismatic finger joints.
force_observer_enabled: true
force_observer_backend: articulation_effort
force_observer_articulation_root: /mir/base_link_cabinet/cabinet/ur_mount/ur5e_physics
force_observer_left_finger_joint_name: left_finger_joint
force_observer_right_finger_joint_name: right_finger_joint

# These are NOT Newtons yet; they are Isaac measured prismatic-joint effort units.
# V10 observed ≈0 before contact and roughly 0.38–1.18 while holding foam.
force_observer_target_effort_sim: 0.350000
force_observer_max_effort_sim: 1.20
force_observer_contact_effort_threshold_sim: 0.05
force_observer_target_band_sim: 0.10
force_observer_baseline_abs_deadband: 0.0001
force_observer_trace_stride_frames: 10

# Phase 1 is monitor-only. We log force feedback first, then close the loop after
# a few stable traces prove effort correlates with contact/hold/lift.
adaptive_grasp_monitor_only: true

# ───────────── ADAPTIVE EFFORT CONTROL PHASE 2 ─────────────
# This is the first closed-loop gripper regulation layer.
# It does NOT use ContactSensor.force, because deformable foam contact returned
# contact geometry but zero contact force. It uses the validated finger-joint
# effort observer from the 2FG7 prismatic DOFs.
adaptive_grasp_monitor_only: false
adaptive_effort_control_enabled: true

# First integrated successful run showed stable lift around grip_effort_sim≈0.33.
# We therefore target a gentle effort around 0.35 rather than chasing high squeeze.
adaptive_effort_target_sim: 0.350000
adaptive_effort_target_band_sim: 0.08
adaptive_effort_max_sim: 1.20

# Conservative motion increments. Positive closes the fingers; negative opens.
adaptive_effort_close_step_m: 0.00020
adaptive_effort_open_step_m: 0.00025
adaptive_effort_max_extra_close_m: 0.00150
adaptive_effort_max_relax_open_m: 0.00100
adaptive_effort_sample_stride_frames: 5
adaptive_effort_max_frames: 90
adaptive_effort_required_stable_samples: 3

# ───────────── PHASE 2.5: ACTUAL SCALAR GRIPPER ADMITTANCE ─────────────
# This supersedes the Phase-2 deadband regulator. It is a true 1D admittance
# model around the gripper HOLD target:
#   M*x_ddot + D*x_dot + K*x = G*(F_target - F_measured)
# where F_measured is measured prismatic finger-joint effort from Isaac.
adaptive_effort_controller_mode: scalar_admittance
force_observer_target_effort_sim: 0.350000
force_observer_target_band_sim: 0.08
force_observer_audit_rich_joint_signals: true

adaptive_admittance_virtual_mass: 1.0
adaptive_admittance_virtual_damping: 12.0
adaptive_admittance_virtual_stiffness: 35.0
adaptive_admittance_effort_to_accel_gain: 0.04
adaptive_admittance_deadband_sim: 0.03
adaptive_admittance_dt_s: 0.0166666667
adaptive_admittance_max_velocity_mps: 0.0015
adaptive_admittance_max_delta_per_update_m: 0.00010

# ───────────── PHASE 3.0: DEFORMATION-AWARE SAFETY MONITOR ─────────────
# This monitor fuses measured finger-joint effort with live soft-object shape.
# It does not replace scalar admittance; it acts as a reactive inhibitor that can
# request gentle relaxation if effort/deformation becomes unsafe.
adaptive_safety_monitor_enabled: true
adaptive_safety_abort_on_unsafe: false
adaptive_safety_soft_sample_stride: 5
adaptive_safety_warn_effort_sim: 0.95
adaptive_safety_max_effort_sim: 1.20
adaptive_safety_warn_compression_ratio: 0.18
adaptive_safety_max_compression_ratio: 0.25
adaptive_safety_min_height_ratio: 0.70
adaptive_safety_max_lateral_expansion_ratio: 1.40
adaptive_safety_max_table_penetration_m: 0.006

# ───────────── PHASE 3.3: DEFORMATION SEVERITY INDEX ─────────────
# The safety monitor now computes height_ratio, compression_x/y, height_loss,
# lateral expansion, estimated volume ratio, deformation_score, and combined risk.
# Defaults assume the current benchmark foam cube is approximately 40 mm per side.
adaptive_safety_nominal_width_m: 0.040
adaptive_safety_nominal_depth_m: 0.040
adaptive_safety_nominal_height_m: 0.040
adaptive_safety_warn_height_ratio: 0.85
adaptive_safety_warn_lateral_expansion_ratio: 1.20
adaptive_safety_warn_deformation_score: 0.600000
adaptive_safety_max_deformation_score: 1.000000
adaptive_safety_warn_combined_risk_score: 0.750000
adaptive_safety_max_combined_risk_score: 0.900000
adaptive_safety_reaction_test_mode: normal


# ───────────── PHASE 3.5: SAFETY-AWARE RETRY POLICY ─────────────
# If the deformation-aware safety monitor requests reactive relaxation, the
# executor stops the current attempt instead of continuing to micro-lift.
# RetryPolicy then selects a safer second attempt.
retry_adaptive_safety_allow_retry: true
retry_adaptive_safety_force_scale: 0.90
retry_adaptive_safety_fragile_force_scale: 0.85
retry_adaptive_safety_effort_target_scale: 0.85
retry_adaptive_safety_hold_extra_delta_m: -0.00025
retry_adaptive_safety_hold_settle_extra_s: 0.5
retry_adaptive_safety_micro_lift_speed_scale: 0.70
retry_adaptive_safety_reacquire_pose: true

# ───────────── PHASE 4.0: SEMANTIC TABLE ZONES / MARKERS ─────────────
# Visual-only table stickers used to make pick-and-place reproducible.
# Coordinates are table-local:
#   local x = approach/depth direction
#   local y = sideways/perpendicular direction
# For the current fixed table, pickup world is approximately [1.03, -0.20]
# and place world is approximately [1.03, 0.25].
table_zones_enabled: true
table_zone_marker_collision_enabled: false   # keep markers visual-only; do not change soft contact physics
table_zone_marker_thickness_m: 0.0002   # 0.2 mm visual sticker; effectively flat
table_zone_marker_z_offset_m: 0.00015   # just above table to avoid z-fighting; no collision
table_zone_crosshair_enabled: true

table_zones:
  pickup_zone:
    label: pickup_zone
    role: object_spawn_and_pickup
    local_xy_m: [-0.07, -0.20]
    size_xy_m: [0.08, 0.08]
    color: [0.10, 0.35, 1.00]
    cross_color: [1.00, 1.00, 1.00]
    crosshair: true
    crosshair_strip_width_m: 0.004

  place_zone:
    label: place_zone
    role: target_placement_region
    local_xy_m: [-0.07, 0.25]
    size_xy_m: [0.08, 0.08]
    color: [0.10, 0.80, 0.20]
    cross_color: [1.00, 1.00, 1.00]
    crosshair: true

# ───────────── PHASE 4.1: HELD-OBJECT TRANSPORT TO PLACE ZONE ─────────────
# Transport the object after validated full lift, but do not release yet.
# This validates the transport part of delicate pick-and-place while preserving
# the already-tested grasp/release safety work for the next phase.
enable_place_transport_test: true
place_transport_duration: 5.0
place_transport_steps: 300
post_place_transport_settle_seconds: 0.5
place_transport_xy_tolerance_m: 0.070
max_object_flange_distance_after_transport_m: 0.28
min_object_above_table_after_transport_m: 0.03
place_default_object_height_m: 0.04

# ───────────── PHASE 4.1b: TRANSPORT STABILITY TUNING ─────────────
# Phase 4.1 showed successful arrival above the place zone, but the object
# visibly slipped/stretched during sideways motion.  Stabilize transport by
# using a lower carrying waypoint, slower interpolation, and explicit soft-shape
# validation after transport.
place_transport_waypoint: lift
place_transport_use_safe_height_wrapper: false
place_transport_duration: 5.0
place_transport_steps: 300
post_place_transport_settle_seconds: 0.6
place_transport_max_width_ratio: 1.35
place_transport_max_deformation_score: 0.25
place_transport_fail_on_excessive_deformation: true
# ───────────── PHASE 4.1c: ACTIVE GRIPPER ADMITTANCE DURING TRANSPORT ─────────────
# Phase 4.1b made transport lower/slower, but a passive gripper hold can still
# allow soft-object slip/stretch during sideways motion.  This keeps the same
# scalar gripper-admittance idea active while the arm moves.  The target effort
# is slightly higher than the static hold target because transport adds lateral
# shear demand.  Corrections remain sub-millimetric to avoid crushing.
place_transport_admittance_enabled: true
place_transport_effort_boost_sim: 0.05
place_transport_admittance_target_effort_sim: 0.40
place_transport_admittance_max_effort_sim: 1.20
place_transport_admittance_deadband_sim: 0.030
place_transport_admittance_sample_stride_frames: 6
place_transport_admittance_delta_step_m: 0.00008
place_transport_admittance_max_extra_close_m: 0.00150
place_transport_admittance_max_relax_open_m: 0.00000
place_transport_slip_warn_relative_drift_m: 0.0020
place_transport_slip_close_relative_drift_m: 0.0030
place_transport_slip_critical_relative_drift_m: 0.0100
place_transport_admittance_warn_deformation_score: 0.20
place_transport_disable_relax_during_motion: true
place_transport_abort_on_critical_slip: true
place_transport_abort_on_effort_loss: true
place_transport_abort_on_table_drop: true
place_transport_effort_loss_threshold_sim: 0.10
place_transport_min_table_gap_during_hold_m: 0.030
place_transport_emergency_close_step_m: 0.00012

# ───────────── PHASE 4.1f: SHEAR FORCE / SLIP OBSERVABILITY AUDIT ─────────────
# We pause reactive transport-policy changes and measure the real cause of slip.
# The audit estimates transport shear demand from object mass, gravity, and
# flange acceleration, then compares it against the measured gripper effort proxy
# and live object/flange drift from the soft simulation mesh.
place_transport_shear_audit_enabled: true
place_transport_shear_audit_sample_stride_frames: 6
place_transport_shear_audit_max_trace_samples: 120
place_transport_shear_audit_object_mass_kg: 0.010
place_transport_default_object_mass_kg: 0.010
place_transport_shear_audit_gravity_mps2: 9.81
place_transport_shear_audit_mu_candidates: [0.30, 0.50, 0.80]
place_transport_shear_audit_safety_factor: 2.0
place_transport_shear_audit_assumed_normal_axis_local: "+X"
place_transport_shear_audit_warn_relative_drift_m: 0.0040
place_transport_shear_audit_warn_slip_velocity_mps: 0.0030

# Phase 4.1f default: audit-only.  Do not let the transport gripper controller
# add squeeze/relaxation while we are trying to identify the cause of slip.
place_transport_admittance_enabled: false
place_transport_abort_on_critical_slip: false
place_transport_abort_on_effort_loss: false
place_transport_abort_on_table_drop: false

# Keep transport reasonably fast so measured shear/acceleration is meaningful,
# but not as aggressively slow as the previous diagnostic run.
place_transport_duration: 5.0
place_transport_steps: 300

# ───────────── PHASE 4.1g: CALIBRATED SHEAR-AWARE TRANSPORT ─────────────
# The Phase 4.1f audit showed that the cube is not failing because the arm
# misses the place zone; it creeps/slips out of the gripper under a
# gravity-dominated shear load.  Therefore we use a friction-grasp model before
# transport instead of waiting for visible slip.
place_transport_shear_compensation_enabled: true
place_transport_shear_preload_enabled: true
place_transport_shear_preload_settle_seconds: 0.25

# Contact-axis selection.  AUTO_HORIZONTAL_MAX_SHEAR avoids the previous bad
# assumption that flange +X was automatically the contact normal.  In the audit
# +X was nearly vertical; for parallel-jaw support the relevant contact normal
# should be a mostly horizontal candidate, because gravity is then tangential
# shear that must be resisted by friction.
place_transport_contact_normal_axis_mode: AUTO_HORIZONTAL_MAX_SHEAR
place_transport_contact_normal_axis_local: AUTO
place_transport_contact_axis_max_abs_vertical_component: 0.75

# Shear model: 2*mu*N >= F_shear.  We keep mu conservative because soft foam on
# simulated gripper pads can have effective friction/contact behavior lower than
# ideal visual intuition.  The target is still an effort proxy, not calibrated
# true fingertip normal force.
place_transport_shear_mu_effective: 0.35
place_transport_shear_safety_factor: 2.0
place_transport_shear_accel_scale: 6.0
place_transport_proxy_effort_per_newton: 1.0
place_transport_proxy_effort_bias_sim: 0.25
place_transport_shear_target_min_sim: 0.42
place_transport_shear_target_max_sim: 0.62

# Re-enable transport feedback, but now with shear feed-forward target override
# and stationary preload.  The feedback should correct small residual drift; it
# should not be the first line of defense.
place_transport_admittance_enabled: true
place_transport_admittance_sample_stride_frames: 3
place_transport_admittance_deadband_sim: 0.025
place_transport_admittance_delta_step_m: 0.00004
place_transport_admittance_max_extra_close_m: 0.00060
place_transport_admittance_max_relax_open_m: 0.00000
place_transport_disable_relax_during_motion: true

# Do not abort merely because relative drift crosses the old 8-10 mm diagnostic
# threshold; first let the shear-preloaded controller demonstrate whether the
# predicted normal effort can hold the object.  Still stop if the object touches
# the table, because then the held-object transport has physically failed.
place_transport_slip_warn_relative_drift_m: 0.0020
place_transport_slip_close_relative_drift_m: 0.0030
place_transport_slip_critical_relative_drift_m: 0.0140
place_transport_abort_on_critical_slip: false
place_transport_abort_on_effort_loss: false
place_transport_abort_on_table_drop: true
place_transport_effort_loss_threshold_sim: 0.06
place_transport_min_table_gap_during_hold_m: 0.012
place_transport_emergency_close_step_m: 0.00008

# Keep audit on while testing 4.1g so every run logs the predicted shear,
# required normal force, and whether the effort proxy margin was meaningful.
place_transport_shear_audit_enabled: true
place_transport_shear_audit_assumed_normal_axis_local: AUTO_HORIZONTAL_MAX_SHEAR
place_transport_duration: 5.0
place_transport_steps: 300
post_place_transport_settle_seconds: 0.6
# ───────────── PHASE 4.1h: STRONGER STATIONARY PRELOAD + ROTATION-AWARE SHAPE ─────────────
# Phase 4.1g improved transport but preload did not actually reach the predicted
# shear target before motion.  This phase strengthens the *stationary* preload
# before transport and adds PCA/OBB shape metrics so rotation is not mistaken for
# material stretch.
place_transport_shear_preload_enabled: true
place_transport_direct_preload_enabled: true
place_transport_direct_preload_target_band_sim: 0.035
place_transport_direct_preload_max_frames: 220
place_transport_direct_preload_sample_stride_frames: 4
place_transport_direct_preload_step_m: 0.00008
place_transport_direct_preload_max_extra_close_m: 0.00120
place_transport_direct_preload_required_stable_samples: 2
place_transport_direct_preload_max_effort_sim: 1.20
place_transport_direct_preload_max_shape_ratio: 1.45
place_transport_direct_preload_force_n: 45.0

# Slightly stronger shear reference.  The previous target was ~0.53, but the
# stationary preload only reached ~0.39 before transport.  Keep the target capped
# and let the shape monitor stop preload if the object begins over-deforming.
place_transport_shear_mu_effective: 0.30
place_transport_shear_safety_factor: 2.0
place_transport_proxy_effort_bias_sim: 0.27
place_transport_shear_target_min_sim: 0.48
place_transport_shear_target_max_sim: 0.70

# Transport residual feedback remains small; most holding should be achieved
# before transport begins, not chased after the cube starts slipping.
place_transport_admittance_max_extra_close_m: 0.00080
place_transport_admittance_delta_step_m: 0.00004
place_transport_admittance_sample_stride_frames: 3

# Rotation-aware shape validation.
place_transport_use_oriented_shape_for_deformation: true
place_transport_max_width_ratio: 1.42
place_transport_max_deformation_score: 0.42
place_transport_fail_on_excessive_deformation: true

# Keep audit/logging active.
place_transport_shear_audit_enabled: true
post_place_transport_settle_seconds: 0.6
# ───────────── PHASE 4.1i: PRELOAD-PLUS-CREEP REDUCTION TUNING ─────────────
# Phase 4.1h nearly succeeded: placement XY was good, object stayed held,
# post-transport effort stayed nonzero, and oriented deformation only exceeded
# the threshold by ~0.01-0.02.  Remaining failure is slow creep/stretch during
# the 5 s carry.  Since gravity shear dominates over dynamic acceleration, a
# slightly faster carry plus stronger stationary preload is more rational than
# slow transport plus repeated squeezing during motion.

# Stronger predicted shear preload.  Conservative mu raises required normal
# effort, but max target prevents blind crushing.
place_transport_shear_mu_effective: 0.27
place_transport_shear_safety_factor: 2.0
place_transport_proxy_effort_bias_sim: 0.29
place_transport_shear_target_min_sim: 0.56
place_transport_shear_target_max_sim: 0.72

# Make the stationary preload get closer to the shear target before moving.
place_transport_direct_preload_target_band_sim: 0.025
place_transport_direct_preload_max_frames: 260
place_transport_direct_preload_sample_stride_frames: 4
place_transport_direct_preload_step_m: 0.00008
place_transport_direct_preload_max_extra_close_m: 0.00160
place_transport_direct_preload_required_stable_samples: 3
place_transport_direct_preload_max_effort_sim: 1.05
place_transport_direct_preload_max_shape_ratio: 1.32
place_transport_direct_preload_force_n: 48.0

# Residual transport feedback is now restrained: if effort is already above
# target, additional closure may produce extrusion rather than useful friction.
place_transport_admittance_max_extra_close_m: 0.00040
place_transport_admittance_delta_step_m: 0.000035
place_transport_admittance_sample_stride_frames: 3
place_transport_slip_close_effort_margin_sim: 0.040
place_transport_slip_close_max_shape_ratio: 1.34
place_transport_slip_close_relative_drift_m: 0.0035

# Carry a bit faster to reduce time-dependent creep.  The audit showed transport
# acceleration is tiny compared with gravity shear, so this is unlikely to be
# the dominant load increase.
place_transport_duration: 4.0
place_transport_steps: 240
post_place_transport_settle_seconds: 0.45

# Rotation-aware validation.  Keep it meaningful, but avoid failing on a tiny
# empirical overshoot when object is still held, above table, and close to zone.
place_transport_use_oriented_shape_for_deformation: true
place_transport_max_width_ratio: 1.48
place_transport_max_deformation_score: 0.48
place_transport_fail_on_excessive_deformation: true